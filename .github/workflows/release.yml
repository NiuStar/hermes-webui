# Fail closed: creating a version tag must not publish an untested image,
# mutable latest, or a GitHub Release. A protected, artifact-tested promotion
# workflow is required before those side effects can be restored.
name: Release & Docker (publication disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Reject publication until artifact attestation is implemented
        run: |
          echo 'Release publication is disabled: a digest- and platform-bound CI receipt, independent signer, and operator approval are required.' >&2
          exit 1
