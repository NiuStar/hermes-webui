# Fail closed: a version tag alone must not publish an untested image,
# mutable latest, or a GitHub Release. Publication needs an artifact-tested
# promotion workflow with digest/platform/source readback and operator approval.
# An independent publisher signature is NOT required for Agent online updates.
name: Release & Docker (publication disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Reject publication until artifact-tested promotion is implemented
        run: |
          echo 'Release publication is disabled: build the frozen WebUI+Agent source, verify runtime and digest/platform identity, and approve operator-controlled promotion first; no detached signature is required.' >&2
          exit 1
