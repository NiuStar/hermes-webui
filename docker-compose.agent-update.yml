# Explicit single-container Agent update opt-in; use together with docker-compose.yml.
# The release.json pin is operator-provisioned; it is not a browser input.
# The existing runtime image must be pinned to the accepted immutable digest;
# an update must reconcile the next effective Compose image before being durable.
services:
  hermes-webui:
    image: ${HERMES_WEBUI_ACCEPTED_IMAGE:?required}
    pull_policy: missing
    environment:
      - HERMES_WEBUI_DOCKER_SELF_UPDATE=1
      - HERMES_WEBUI_DOCKER_IMAGE=${HERMES_WEBUI_DOCKER_IMAGE:?required}
  hermes-webui-updater:
    image: ${HERMES_WEBUI_ACCEPTED_IMAGE:?required}
    pull_policy: missing
    profiles: ["self-update"]
    network_mode: none
    read_only: true
    environment:
      HERMES_WEBUI_DOCKER_SELF_UPDATE: "1"
      HERMES_WEBUI_DOCKER_IMAGE: ${HERMES_WEBUI_DOCKER_IMAGE:?required}
      HERMES_WEBUI_AGENT_RELEASE_FILE: /run/hermes-agent-release/release.json
    volumes:
      - type: bind
        source: ${HERMES_WEBUI_AGENT_RELEASE_DIR:?required}
        target: /run/hermes-agent-release
        read_only: true
