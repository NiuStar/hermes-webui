# Explicit single-container Agent update opt-in; use together with docker-compose.yml.
# This is NOT a publisher key or release. All required values are operator-provisioned.
# The existing runtime image must be pinned to the accepted immutable digest;
# an update must reconcile the next effective Compose image before being durable.
services:
  hermes-webui:
    image: ${HERMES_WEBUI_ACCEPTED_IMAGE:?required}
    pull_policy: missing
    environment:
      - HERMES_WEBUI_DOCKER_SELF_UPDATE=1
      - HERMES_WEBUI_DOCKER_IMAGE=${HERMES_WEBUI_DOCKER_IMAGE:?required}
  hermes-webui-updater:
    image: ${HERMES_WEBUI_ACCEPTED_IMAGE:?required}
    pull_policy: missing
    profiles: ["self-update"]
    network_mode: none
    read_only: true
    environment:
      HERMES_WEBUI_DOCKER_SELF_UPDATE: "1"
      HERMES_WEBUI_DOCKER_IMAGE: ${HERMES_WEBUI_DOCKER_IMAGE:?required}
      HERMES_WEBUI_AGENT_COMMIT: ${HERMES_WEBUI_AGENT_COMMIT:?required}
      HERMES_WEBUI_AGENT_MANIFEST_PATH: /run/hermes-agent-release/manifest.json
      HERMES_WEBUI_AGENT_MANIFEST_SIGNATURE_PATH: /run/hermes-agent-release/manifest.json.sig
      HERMES_WEBUI_AGENT_MANIFEST_PUBKEY: /run/hermes-agent-release/publisher.pub
      HERMES_WEBUI_AGENT_MANIFEST_PUBKEY_SHA256: ${HERMES_WEBUI_AGENT_MANIFEST_PUBKEY_SHA256:?required}
    volumes:
      - type: bind
        source: ${HERMES_WEBUI_AGENT_MANIFEST_FILE:?required}
        target: /run/hermes-agent-release/manifest.json
        read_only: true
      - type: bind
        source: ${HERMES_WEBUI_AGENT_MANIFEST_SIGNATURE_FILE:?required}
        target: /run/hermes-agent-release/manifest.json.sig
        read_only: true
      - type: bind
        source: ${HERMES_WEBUI_AGENT_PUBLISHER_PUBKEY_FILE:?required}
        target: /run/hermes-agent-release/publisher.pub
        read_only: true
